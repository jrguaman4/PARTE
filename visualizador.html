<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizador Parte General · TH Zona 8</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body class="app">
<div class="bg-overlay"></div>

<nav class="topbar no-print">
  <a href="index.html" class="brand">
    <img src="https://cdn.brandfetch.io/idBMnLXNaD/w/268/h/267/theme/light/logo.png?c=1dxbfHSJFAPEGdCLU4o5B" onerror="this.style.display='none'">
    <span>SIGTH-Z8<small>VISUALIZADOR PARTE GENERAL</small></span>
  </a>
  <div class="spacer"></div>
  <input type="date" id="fecha" class="form-control" style="max-width:170px">
  <button class="btn btn-gold" onclick="guardarDia()"><i class="bi bi-save"></i> Guardar día</button>
  <button class="btn btn-ghost" onclick="imprimirReporte()"><i class="bi bi-printer"></i> Imprimir</button>
</nav>

<div class="container-app">
  <!-- KPIs -->
  <div class="kpi-row">
    <div class="kpi glass-card"><div class="lbl">Efectivo total</div><div class="val gold" id="k-total">—</div></div>
    <div class="kpi glass-card"><div class="lbl">Presente</div><div class="val ok" id="k-pres">—</div></div>
    <div class="kpi glass-card"><div class="lbl">Franco</div><div class="val" id="k-franco">—</div></div>
    <div class="kpi glass-card"><div class="lbl">Novedad / Ausente</div><div class="val bad" id="k-aus">—</div></div>
    <div class="kpi glass-card"><div class="lbl">Dependencias</div><div class="val" id="k-dep">—</div></div>
    <div class="kpi glass-card"><div class="lbl">Validadas hoy</div><div class="val gold" id="k-val">—</div></div>
  </div>

  <!-- Charts -->
  <div class="row g-3">
    <div class="col-lg-6"><div class="panel glass-card"><h3><i class="bi bi-pie-chart"></i> Distribución por Estado</h3><canvas id="chEstado" height="150"></canvas></div></div>
    <div class="col-lg-6"><div class="panel glass-card"><h3><i class="bi bi-bar-chart"></i> Efectivo por Dependencia</h3><canvas id="chDep" height="150"></canvas></div></div>
  </div>

  <!-- Filtros -->
  <div class="panel glass-card no-print">
    <h3><i class="bi bi-funnel"></i> Filtros</h3>
    <div class="row g-2">
      <div class="col-md-3"><label class="form-label">Buscar</label><input id="f-q" class="form-control" placeholder="Cédula / nombre"></div>
      <div class="col-md-3"><label class="form-label">Dependencia</label><select id="f-dep" class="form-select"></select></div>
      <div class="col-md-2"><label class="form-label">Estado</label><select id="f-est" class="form-select"></select></div>
      <div class="col-md-2"><label class="form-label">Grupo</label><select id="f-gru" class="form-select"></select></div>
      <div class="col-md-2 d-flex align-items-end gap-2">
        <button class="btn btn-gold w-100" onclick="render()"><i class="bi bi-search"></i></button>
        <button class="btn btn-ghost" onclick="limpiar()"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="panel glass-card">
    <h3><i class="bi bi-table"></i> Parte General <span id="rep-fecha" class="ms-auto" style="font-size:.85rem;color:var(--muted)"></span></h3>
    <div id="rep-resp" style="display:none;margin-bottom:10px;color:var(--gold);font-family:var(--font-d)"></div>
    <div class="table-wrap">
      <table class="tbl">
        <thead><tr><th>#</th><th>Cédula</th><th>Grado</th><th>Nombres</th><th>Dependencia</th><th>Función</th><th>Novedades / Alertas</th><th>Grupo</th><th>Estado</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-2 no-print">
      <small id="count" style="color:var(--muted)"></small>
      <div id="pager" class="d-flex gap-1"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/visualizador.js"></script>
</body>
</html>
